# This configuration is used for Okta authentication

CGIDScriptTimeout 100

LoadModule auth_openidc_module /lib/apache2/modules/mod_auth_openidc.so

ScriptAlias "/perl/"  "${NPG_TRACKING_SERVER_PATH}/cgi-bin/"
<Directory "${NPG_TRACKING_SERVER_PATH}/cgi-bin/">
    Options +ExecCGI
    AddHandler cgi-script .pl .cgi
    AllowOverride None
    Require all granted
    AcceptPathInfo On
</Directory>

# === OIDC settings ===
OIDCProviderMetadataURL            https://sanger.okta.com/.well-known/openid-configuration
OIDCRedirectURI                    /callback
OIDCClientID                       ${OIDCClientID}
OIDCClientSecret                   ${OIDCClientSecret}
OIDCCryptoPassphrase               ${OIDCCryptoPassphrase}
OIDCScope                          "openid email profile groups"
OIDCPassClaimsAs                   environment
OIDCPassIDTokenAs                  claims
OIDCRefreshAccessTokenBeforeExpiry 0
OIDCAuthRequestParams              prompt=login
OIDCSSLValidateServer              On
OIDCResponseType                   code

# Session / Cookie Settings
OIDCSessionType                    server-cache:persistent
OIDCCacheType                      shm
OIDCCacheShmEntrySizeMax           65536

# Session duration: 8 hours, refresh every hour
OIDCSessionInactivityTimeout       28800
OIDCSessionMaxDuration             3600

# Cookie settings
OIDCCookie                         oidc_session
OIDCCookiePath                     /
OIDCCookieHTTPOnly                 On
OIDCCookieSameSite                 On

# Callback
<Location /callback>
    AuthType openid-connect
    Require valid-user
</Location>

# Protected application area
<Location /perl/okta-post-login-actions.cgi>
    AuthType openid-connect
    Require valid-user
</Location>

# Security Headers
Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sanger.okta.com"

